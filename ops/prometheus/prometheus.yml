global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8080"]

  - job_name: data-ingestion
    static_configs:
      - targets: ["data-ingestion:8080"]

  - job_name: ai-engine
    static_configs:
      - targets: ["ai-engine:8080"]

  - job_name: realtime-engine
    static_configs:
      - targets: ["realtime-engine:8080"]

  - job_name: simulation-engine
    static_configs:
      - targets: ["simulation-engine:8080"]
